version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conectaartesanato-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - MONGO_URL=mongodb://mongo:27017/conectaartesanato
    depends_on:
      - mongo
    networks:
      - conecta-network

  mongo:
    image: mongo:6.0
    container_name: conectaartesanato-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - conecta-network

volumes:
  mongo-data:

networks:
  conecta-network:
    driver: bridge